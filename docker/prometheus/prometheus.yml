global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'scheduler'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000', 'scheduler:3000']

  - job_name: 'scanner'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001', 'scanner:3001']

  - job_name: 'dispatcher'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3002', 'dispatcher:3002']

  - job_name: 'worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3003', 'worker:3003']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq_exporter:9419']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
